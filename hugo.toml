# Конфигурация сайта. baseURL менять только вместе с настройками GitHub Pages:
# от него зависят абсолютные ссылки, canonical и sitemap.
baseURL = "https://denistv.com/"
title = "Денис Твердохлебов"
locale = "ru-RU"
defaultContentLanguage = "ru"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "RSS", "sitemap"]

# Своя тема: layouts, стили и шрифты живут в themes/rungpt.
theme = "rungpt"

[params]
  author = "Денис Твердохлебов"
  brand = "denistv.com"
  description = "Go-разработчик и технический лидер: AI-инфраструктура, агенты, платформенные команды"
  copyright = "denistv"

[[params.social]]
  name = "Telegram"
  url = "https://t.me/denistv777"

[[params.social]]
  name = "GitHub"
  url = "https://github.com/denistv"

[[params.social]]
  name = "LinkedIn"
  url = "https://www.linkedin.com/in/denistv777"

[markup]
  [markup.goldmark.renderer]
    # Сырой HTML в Markdown не рендерим: контент должен оставаться чистым.
    unsafe = false

  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false
