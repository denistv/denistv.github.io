{{ define "main" }}
  <div class="docs-layout">
    {{ partial "docs-nav.html" . }}

    <article class="docs-main prose">
      <p class="docs-kicker">Документация</p>
      <h1>{{ .Title }}</h1>
      {{ .Content }}

      <div class="docs-cards">
        {{ range .Pages.ByWeight }}
          <a class="docs-card" href="{{ .RelPermalink }}">
            <span class="docs-card__title">{{ .Title }}</span>
            {{ with .Description }}<span class="docs-card__text">{{ . }}</span>{{ end }}
          </a>
        {{ end }}
      </div>
    </article>

    {{ partial "docs-toc.html" . }}
  </div>
{{ end }}
